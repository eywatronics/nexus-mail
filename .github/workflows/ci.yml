name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  WAILS_VERSION: v3.0.0-beta.9

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # main.go embeds frontend/dist, so the Go tree does not compile until the
      # frontend has been built at least once.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The CLI only parses the Go tree and writes bindings here. Building it
      # with the server tag avoids pulling GTK into a job that never opens a
      # window, and keeps this job from depending on the Ubuntu package mirror.
      - name: Install Wails CLI
        env:
          CGO_ENABLED: "0"
        run: go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      # The race detector and golangci both compile with cgo, so Wails'
      # Linux backend needs the GTK headers even though this job opens no
      # window. The runner image already carries package lists; skipping
      # apt-get update avoids the mirror stall that held this job for minutes.
      - name: Linux WebKit dependencies
        run: sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # -ts -i, the same flags build/Taskfile.yml uses. Without them the
      # bindings come out as JavaScript, and because tsconfig sets
      # noImplicitAny to false the build still passes — with every call across
      # the bridge typed as `any`. This job would then be checking types
      # everywhere except the one boundary where the two languages meet.
      - name: Generate bindings and build frontend
        run: |
          wails3 generate bindings -clean=true -ts -i
          cd frontend && npm ci && npm run build

      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v node_modules)" || (gofmt -l . | grep -v node_modules && exit 1)

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      # fts_messages is maintained by triggers. Application code writing to it
      # directly is how the index silently drifts out of step; see design
      # doc section 5.2.
      - name: Application code must not write to the FTS table
        run: |
          if grep -rn "INSERT INTO fts_messages" --include='*.go' internal/ | grep -v '_test.go'; then
            echo "fts_messages is maintained by triggers; remove the direct write"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Same reason as the lint job: bindings generation does not need the
      # GUI, so the CLI is built without GTK.
      - name: Install Wails CLI
        env:
          CGO_ENABLED: "0"
        run: go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Generate bindings and build frontend
        run: |
          wails3 generate bindings -clean=true -ts -i
          cd frontend && npm ci && npm run build

      # cgo-backed race detector needs Wails' GTK headers. The runner image
      # already carries package lists; skipping apt-get update avoids the
      # mirror stall that held this job for minutes.
      - name: Linux WebKit dependencies
        run: sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # -race requires cgo, so CGO_ENABLED stays at its default here. That is
      # not a contradiction of the cgo ban: the ban is about what the shipped
      # binary links, which the build matrix verifies. The race detector is a
      # test-time instrument.
      - name: Go tests with the race detector
        run: go test -race ./...

      # And once more on the pure-Go path, to prove the code the users actually
      # get behaves the same. Without this, a modernc.org/sqlite regression
      # under CGO_ENABLED=0 would only surface at build time, not in tests.
      #
      # -tags server leaves out the Linux GUI backend, which imports GTK
      # through cgo. The application's own packages and all internal packages
      # are still built and tested; this is the only way the pure-Go gate can
      # cover a Linux runner at all.
      - name: Go tests on the pure-Go path
        env:
          CGO_ENABLED: "0"
        run: go test -tags server ./...

      - name: Frontend tests
        run: cd frontend && npm test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # CGO_ENABLED=0 on these two is the guard proving our dependency tree
          # stays pure Go. Mark both as required status checks in branch
          # protection. A cgo-dependent library added by mistake breaks here
          # and nowhere else.
          #
          # The Linux GUI backend needs cgo for GTK, so the Ubuntu gate builds
          # with -tags server. That excludes the GUI only; main.go and every
          # internal package are still compiled on the pure-Go path.
          - os: windows-latest
            cgo: "0"
            tags: ""
          - os: ubuntu-latest
            cgo: "0"
            tags: server
          # macOS needs cgo: the Wails WebView binding requires it. This job
          # therefore cannot catch a cgo dependency creeping in.
          - os: macos-latest
            cgo: "1"
            tags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The CLI is only used to generate bindings. The application build below
      # still uses the matrix's cgo and tags, so the GUI is not hidden from the
      # gate; only the CLI's own GTK dependency is.
      - name: Install Wails CLI
        env:
          CGO_ENABLED: "0"
        run: go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # A CLI newer or older than the library generates bindings the app does
      # not match, and the failure surfaces as confusing frontend type errors
      # rather than as a version problem.
      #
      # 2>&1 is the whole fix and it is not cosmetic: wails3 prints its
      # version to stderr, so capturing stdout alone left cli empty and this
      # gate failed on every run since it was written. The emptiness is now
      # its own error, because "the versions differ" was a misleading way to
      # say "nothing was read".
      - name: CLI must match the library version
        shell: bash
        run: |
          lib=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          cli=$(wails3 version 2>&1 | tr -d '\r' | grep -oE 'v3\.[0-9]+\.[0-9]+[^[:space:]]*' | head -1)
          echo "library=$lib cli=$cli"
          if [ -z "$cli" ]; then
            echo "could not read a version out of wails3 version" >&2
            exit 1
          fi
          test "$lib" = "$cli"

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          wails3 generate bindings -clean=true -ts -i
          cd frontend && npm ci && npm run build && cd ..
          go build -tags "${{ matrix.tags }}" ./...
