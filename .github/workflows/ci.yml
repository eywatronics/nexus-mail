name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  WAILS_VERSION: v3.0.0-beta.9

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # main.go embeds frontend/dist, so the Go tree does not compile until the
      # frontend has been built at least once.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Generate bindings and build frontend
        run: |
          wails3 generate bindings
          cd frontend && npm ci && npm run build

      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v node_modules)" || (gofmt -l . | grep -v node_modules && exit 1)

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

      # fts_messages is maintained by triggers. Application code writing to it
      # directly is how the index silently drifts out of step; see design
      # doc section 5.2.
      - name: Application code must not write to the FTS table
        run: |
          if grep -rn "INSERT INTO fts_messages" --include='*.go' internal/ | grep -v '_test.go'; then
            echo "fts_messages is maintained by triggers; remove the direct write"
            exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Generate bindings and build frontend
        run: |
          wails3 generate bindings
          cd frontend && npm ci && npm run build

      # -race requires cgo, so CGO_ENABLED stays at its default here. That is
      # not a contradiction of the cgo ban: the ban is about what the shipped
      # binary links, which the build matrix verifies. The race detector is a
      # test-time instrument.
      - name: Go tests with the race detector
        run: go test -race ./...

      # And once more on the pure-Go path, to prove the code the users actually
      # get behaves the same. Without this, a modernc.org/sqlite regression
      # under CGO_ENABLED=0 would only surface at build time, not in tests.
      - name: Go tests on the pure-Go path
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Frontend tests
        run: cd frontend && npm test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # CGO_ENABLED=0 on these two is the guard proving our dependency tree
          # stays pure Go. Mark both as required status checks in branch
          # protection — a cgo-dependent library added by mistake breaks here
          # and nowhere else.
          - os: windows-latest
            cgo: "0"
          - os: ubuntu-latest
            cgo: "0"
          # macOS needs cgo: the Wails WebView binding requires it. This job
          # therefore cannot catch a cgo dependency creeping in.
          - os: macos-latest
            cgo: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux WebKit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # A CLI newer or older than the library generates bindings the app does
      # not match, and the failure surfaces as confusing frontend type errors
      # rather than as a version problem.
      - name: CLI must match the library version
        shell: bash
        run: |
          lib=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          cli=$(wails3 version | tr -d '\r' | grep -oE 'v3\.[0-9]+\.[0-9]+[^[:space:]]*' | head -1)
          echo "library=$lib cli=$cli"
          test "$lib" = "$cli"

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          wails3 generate bindings
          cd frontend && npm ci && npm run build && cd ..
          go build ./...
