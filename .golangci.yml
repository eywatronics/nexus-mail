version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # model is a leaf: pure data types, imports nothing from the project.
        model-layer:
          files: ["**/internal/model/**"]
          deny:
            - pkg: "nexusmail/internal/store"
              desc: "model is a leaf package and must import nothing from the project"
            - pkg: "nexusmail/internal/sync"
              desc: "model is a leaf package and must import nothing from the project"
            - pkg: "nexusmail/internal/imapx"
              desc: "model is a leaf package and must import nothing from the project"
            - pkg: "nexusmail/internal/auth"
              desc: "model is a leaf package and must import nothing from the project"
            - pkg: "nexusmail/internal/app"
              desc: "model is a leaf package and must import nothing from the project"

        store-layer:
          files: ["**/internal/store/**"]
          deny:
            - pkg: "nexusmail/internal/sync"
              desc: "store is a bottom layer; it must not depend on sync"
            - pkg: "nexusmail/internal/imapx"
              desc: "store is a bottom layer; it must not depend on imapx"
            - pkg: "nexusmail/internal/app"
              desc: "store is a bottom layer; it must not depend on app"

        imapx-layer:
          files: ["**/internal/imapx/**"]
          deny:
            - pkg: "nexusmail/internal/sync"
              desc: "imapx must not depend on sync"
            - pkg: "nexusmail/internal/app"
              desc: "imapx must not depend on app"
            - pkg: "nexusmail/internal/store"
              desc: "imapx speaks IMAP only; persistence belongs to sync"

        # mailmime assembles an outgoing message. Like mailhtml it is a pure
        # transformation: what comes out is decided entirely by what goes in,
        # which is what lets it be read and tested without a server. The
        # net/http ban is the load-bearing half — building a message must never
        # be a thing that fetches a remote image or a remote stylesheet on the
        # sender's behalf.
        mailmime-layer:
          files: ["**/internal/mailmime/**"]
          deny:
            - pkg: "nexusmail/internal/store"
              desc: "mailmime is a pure transformation over a draft"
            - pkg: "nexusmail/internal/sync"
              desc: "mailmime is a pure transformation over a draft"
            - pkg: "nexusmail/internal/app"
              desc: "mailmime is a pure transformation over a draft"
            - pkg: "nexusmail/internal/smtpx"
              desc: "building a message and sending one are separate jobs"
            - pkg: "net/http"
              desc: "assembling a message must not fetch anything"

        # smtpx is imapx's twin: one narrow interface over one protocol
        # library, so the queue above it can be tested against a fake server.
        smtpx-layer:
          files: ["**/internal/smtpx/**"]
          deny:
            - pkg: "nexusmail/internal/sync"
              desc: "smtpx must not depend on sync"
            - pkg: "nexusmail/internal/app"
              desc: "smtpx must not depend on app"
            - pkg: "nexusmail/internal/store"
              desc: "smtpx speaks SMTP only; persistence belongs to sync"
            - pkg: "nexusmail/internal/imapx"
              desc: "the two protocols are siblings; neither is built on the other"

        sync-layer:
          files: ["**/internal/sync/**"]
          deny:
            - pkg: "nexusmail/internal/app"
              desc: "sync must not depend on app"
            - pkg: "github.com/emersion/go-imap/v2"
              desc: "sync must go through the MailBackend interface so it stays testable against a fake server"
            - pkg: "github.com/emersion/go-smtp"
              desc: "sending goes through the MailSender interface, for the same reason receiving goes through MailBackend"

        auth-layer:
          files: ["**/internal/auth/**"]
          deny:
            - pkg: "nexusmail/internal/sync"
              desc: "auth is a bottom layer; it must not depend on sync"
            - pkg: "nexusmail/internal/store"
              desc: "auth must not depend on store; secrets never reach the database"
            - pkg: "nexusmail/internal/app"
              desc: "auth is a bottom layer; it must not depend on app"
            - pkg: "nexusmail/internal/imapx"
              desc: "auth is a bottom layer; it must not depend on imapx"

        # mailhtml sanitises untrusted HTML. It is a pure transformation and
        # must not reach for the database or the network.
        # !$test exempts test files: the rule exists so production sanitising
        # never fetches anything, while the test that proves no request is made
        # legitimately needs a probe server.
        mailhtml-layer:
          files: ["**/internal/mailhtml/**", "!$test"]
          deny:
            - pkg: "nexusmail/internal/store"
              desc: "mailhtml is a pure transformation over a string"
            - pkg: "nexusmail/internal/sync"
              desc: "mailhtml is a pure transformation over a string"
            - pkg: "nexusmail/internal/app"
              desc: "mailhtml is a pure transformation over a string"
            - pkg: "net/http"
              desc: "sanitising must not fetch anything; the caller proxies remote content"

        # The AI layer (M13) talks to the store and the keyring, nothing else.
        # Written before the package exists so the first commit that creates it
        # is already governed: a rule added afterwards is a rule the code that
        # needed it was written without.
        ai-layer:
          files: ["**/internal/ai/**"]
          deny:
            - pkg: "nexusmail/internal/app"
              desc: "ai is below app; the window reaches it through app services"
            - pkg: "nexusmail/internal/sync"
              desc: "ai reads what sync already stored; it does not drive syncing"
            - pkg: "nexusmail/internal/imapx"
              desc: "ai never speaks IMAP; mail reaches it through the store"

        # Only the provider package may reach the network, so "which code can
        # send a message body to a model" has a one-directory answer. Chunking,
        # retrieval and the indexer work on what is already on disk and go
        # through the LLMProvider and EmbeddingProvider interfaces.
        # !$test exempts tests: proving no request is made needs a probe server.
        ai-network:
          files: ["**/internal/ai/rag/**", "**/internal/ai/worker/**", "!$test"]
          deny:
            - pkg: "net/http"
              desc: "only internal/ai/provider may reach a model; everything else works on stored text"

        # Time-dependent logic is tested with testing/synctest (stable in Go
        # 1.25). Injected-clock libraries deform production code for the
        # tests' benefit; see design doc section 10.1.
        no-clock-libraries:
          files: ["**/internal/**", "main.go"]
          deny:
            - pkg: "github.com/jonboulle/clockwork"
              desc: "use testing/synctest; injected clocks deform production code"
            - pkg: "github.com/benbjohnson/clock"
              desc: "use testing/synctest; injected clocks deform production code"

issues:
  # The architecture rules must hold for the whole tree, not just new code.
  new: false

formatters:
  enable:
    - gofmt
